<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Revenue Estimator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7fdf9;
      color: #1a1a1a;
    }
    .main-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      margin: 40px auto;
      box-shadow: 0 0 20px rgba(0, 128, 0, 0.1);
    }
    .form-control, .form-check-input {
      border-radius: 8px;
    }
    .result-box {
      margin-top: 20px;
      background-color: #e6ffee;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #b3ffcc;
    }
    .result-title {
      font-weight: bold;
      color: #006633;
    }
    .monthly-estimate {
      font-size: 0.9rem;
      color: #555;
      margin-top: 5px;
    }
    .reset-button {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="main-card">
    <h2 class="text-center">Ad Revenue Estimator 🌱</h2>
    <form method="post">
      <div class="mb-3">
        <label for="domain" class="form-label">Website Domain (only for API mode)</label>
        <input type="text" class="form-control" id="domain" name="domain" placeholder="e.g. cnn.com">
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="use_api" name="use_api" checked>
        <label class="form-check-label" for="use_api">Use API (unchecked = Manual)</label>
      </div>

      <div id="manual-fields" style="display: none;">
        <div class="mb-3">
          <label for="visits" class="form-label">Monthly Visits</label>
          <input type="number" class="form-control" name="visits" placeholder="e.g. 100000">
        </div>
        <div class="mb-3">
          <label for="pages_per_visit" class="form-label">Pages per Visit</label>
          <input type="number" class="form-control" name="pages_per_visit" step="0.1" placeholder="e.g. 1.5">
        </div>
        <div class="mb-3">
          <label for="rpm" class="form-label">Revenue per 1000 Impressions (RPM)</label>
          <input type="number" class="form-control" name="rpm" step="0.01" placeholder="e.g. 10.00">
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100">Calculate</button>
      <button type="button" class="btn btn-outline-secondary w-100 reset-button" onclick="resetForm()">Reset</button>
    </form>

    {% if result %}
    <div class="result-box mt-4">
      <div class="result-title">Estimated Monthly Revenue: ${{ result.revenue | commafy }}</div>
      <div class="monthly-estimate">(based on {{ result.mode }} data)</div>
    </div>
    {% endif %}
  </div>

  <script>
    function resetForm() {
      document.querySelector("form").reset();
      document.getElementById("manual-fields").style.display = "none";
    }

    const checkbox = document.getElementById("use_api");
    const manualFields = document.getElementById("manual-fields");
    checkbox.addEventListener("change", function () {
      manualFields.style.display = this.checked ? "none" : "block";
    });
    if (!checkbox.checked) manualFields.style.display = "block";
  </script>
</body>
</html>
